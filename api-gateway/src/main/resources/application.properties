spring.application.name=api-gateway
server.port=8080

# Route table: /{key}/** -> {base-url}/**
gateway.routes.core=http://${CORE_SERVICE_HOST:localhost}:8081
gateway.routes.rest-api=http://${REST_API_SERVICE_HOST:localhost}:8083
gateway.routes.security=http://${SECURITY_SERVICE_HOST:localhost}:8084
gateway.routes.mvc=http://${MVC_SERVICE_HOST:localhost}:8085
gateway.routes.mvc-security=http://${MVC_SECURITY_SERVICE_HOST:localhost}:8086
gateway.routes.intake=http://${INTAKE_SERVICE_HOST:localhost}:8087
