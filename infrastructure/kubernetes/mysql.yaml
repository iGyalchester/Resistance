# Create the init-script ConfigMap first (from the repository root):
#   kubectl -n resistance create configmap db-init --from-file=infrastructure/config/db-init
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: resistance
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: resistance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:9
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root
                  key: password
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: db-init
          configMap:
            name: db-init
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: resistance
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
