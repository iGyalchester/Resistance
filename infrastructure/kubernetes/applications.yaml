# Application deployments. Build images with infrastructure/docker/Dockerfile
# and tag them resistance/<service>:latest (or point at your registry).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-service
  namespace: resistance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-service
  template:
    metadata:
      labels:
        app: security-service
    spec:
      containers:
        - name: security-service
          image: resistance/security-service:latest
          ports:
            - containerPort: 8084
          env:
            - name: DB_HOST
              value: mysql

---
apiVersion: v1
kind: Service
metadata:
  name: security-service
  namespace: resistance
spec:
  selector:
    app: security-service
  ports:
    - port: 8084
