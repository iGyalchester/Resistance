AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Resistance job tracker - inbound email intake via SES receiving.
  SES accepts mail for the intake address, stores the raw message in S3,
  and publishes a notification (with the full MIME content) to an SNS
  topic whose HTTPS subscription POSTs to the intake-service endpoint
  /intake/aws-sns. Prerequisites: the domain is verified in SES, an MX
  record points at inbound-smtp.<region>.amazonaws.com, and SES receiving
  is available in the chosen region.

Parameters:
  IntakeRecipient:
    Type: String
    Description: The email address users forward confirmations to (e.g. track@yourdomain.com)
  IntakeEndpointUrl:
    Type: String
    Description: Public HTTPS URL of the intake-service SNS endpoint (e.g. https://tracker.yourdomain.com/intake/aws-sns)

Resources:
  RawMailBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-mail
            Status: Enabled
            ExpirationInDays: 30

  RawMailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawMailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSesPuts
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${RawMailBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  IntakeTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: resistance-intake

  IntakeTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref IntakeTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSesPublish
            Effect: Allow
            Principal:
              Service: ses.amazonaws.com
            Action: sns:Publish
            Resource: !Ref IntakeTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # POSTs every notification to intake-service; the app confirms the
  # subscription automatically (see SnsIntakeController)
  IntakeSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref IntakeTopic
      Protocol: https
      Endpoint: !Ref IntakeEndpointUrl

  IntakeRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: resistance-intake

  # NOTE: after deploying, activate the rule set once (console or
  # `aws ses set-active-receipt-rule-set --rule-set-name resistance-intake`);
  # SES allows only one active rule set per account and CloudFormation
  # will not flip it for you.
  IntakeRule:
    Type: AWS::SES::ReceiptRule
    DependsOn:
      - RawMailBucketPolicy
      - IntakeTopicPolicy
    Properties:
      RuleSetName: !Ref IntakeRuleSet
      Rule:
        Name: forward-to-tracker
        Enabled: true
        Recipients:
          - !Ref IntakeRecipient
        ScanEnabled: true
        Actions:
          - S3Action:
              BucketName: !Ref RawMailBucket
              TopicArn: !Ref IntakeTopic

Outputs:
  TopicArn:
    Description: Set this as intake.aws.topic-arn in intake-service
    Value: !Ref IntakeTopic
  RawMailBucketName:
    Description: Bucket holding raw MIME messages (30-day expiry)
    Value: !Ref RawMailBucket
