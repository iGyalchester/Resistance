name: resistance

# Run from the repository root:
#   docker compose -f infrastructure/docker-compose.yml up --build
services:
  mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./config/db-init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  security-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        MODULE: services/security-service
    environment:
      DB_HOST: mysql
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy

  mvc-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        MODULE: services/mvc-service
    environment:
      DB_HOST: mysql
      # optional AuditFlow integration (blank = off); see docs/E2E-TEST-PLAN.md
      TRACKER_AUDIT_URL: ${TRACKER_AUDIT_URL:-}
      TRACKER_AUDIT_TOKEN: ${TRACKER_AUDIT_TOKEN:-}
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy

  mvc-security-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        MODULE: services/mvc-security-service
    environment:
      DB_HOST: mysql
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy

  intake-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        MODULE: services/intake-service
    environment:
      DB_HOST: mysql
      # optional AuditFlow integration (blank = off); see docs/E2E-TEST-PLAN.md
      TRACKER_AUDIT_URL: ${TRACKER_AUDIT_URL:-}
      TRACKER_AUDIT_TOKEN: ${TRACKER_AUDIT_TOKEN:-}
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy

  api-gateway:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        MODULE: api-gateway
    environment:
      INTAKE_SERVICE_HOST: intake-service
      SECURITY_SERVICE_HOST: security-service
      MVC_SERVICE_HOST: mvc-service
      MVC_SECURITY_SERVICE_HOST: mvc-security-service
    ports:
      - "8080:8080"
    depends_on:
      - intake-service
      - security-service
      - mvc-service
      - mvc-security-service

volumes:
  mysql-data:
