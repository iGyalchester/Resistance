spring.application.name=etl-runner

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/employee_directory
spring.datasource.username=springstudent
spring.datasource.password=springstudent

# ETL settings
# etl.input-location accepts any Spring resource location (classpath:, file:, ...)
etl.input-location=classpath:sample-data/employees.csv
# set to false to actually write to the database
etl.dry-run=true

spring.main.banner-mode=off
logging.level.root=warn
logging.level.com.resistance=info
