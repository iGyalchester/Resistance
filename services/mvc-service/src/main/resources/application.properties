spring.application.name=mvc-service
# dev is the default profile (local resources only); run QA with --spring.profiles.active=qa
spring.profiles.default=dev
server.port=8085

#
# Health endpoint for the AWS load balancer (and anyone curious). Only
# "health" is exposed, and it reports UP/DOWN without details.
#
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

#
# The mail indicator is off deliberately, in every profile.
#
# Setting spring.mail.host makes Boot register MailHealthIndicator, which
# opens an SMTP connection to SES on every probe. The ALB probes
# /actuator/health every 30 seconds per task and requires a 200, so one SES
# hiccup marks every task DOWN at once: the ALB drains the whole service and
# ECS starts replacing tasks, taking the product offline because *outbound
# email* is unwell. It also means a connection to SES every 30 seconds per
# task purely to ask whether SES is there.
#
# The tracker works fine without mail - the OTP mailer already logs a
# warning and degrades. A load balancer check should answer "can this task
# serve a request", not "is every downstream dependency healthy".
#
management.health.mail.enabled=false

#
# JDBC properties
#
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/job_tracker
spring.datasource.username=springstudent
spring.datasource.password=springstudent

#
# AuditFlow integration (optional)
#
# When tracker.audit.url points at an AuditFlow ingestion-service, this
# service emits audit events (logins, data changes, intake activity) with
# customer id "resistance". Blank = disabled. Emission is asynchronous and
# fire-and-forget: auditing being down never breaks the app (at-most-once,
# by design). The token must match audit.ingestion.token on the AuditFlow
# side.
tracker.audit.url=${TRACKER_AUDIT_URL:}
tracker.audit.token=${TRACKER_AUDIT_TOKEN:}
tracker.audit.customer-id=resistance
