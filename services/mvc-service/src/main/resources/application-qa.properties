#
# qa: runs entirely against AWS. Every ${VAR} below has NO default -
# startup fails fast until the AWS resources exist and are wired in.
# See infrastructure/aws/README.md for provisioning each one.
#
# Behind the ALB every request reaches Tomcat as plain HTTP from a VPC
# address, so without this the app believes it is running on http and sees
# the load balancer as the client. Two things break: redirects to /login go
# out as http:// (the browser is bounced off https), session and XSRF
# cookies never get the Secure flag, and request.getRemoteAddr() returns the
# ALB, which collapses the per-IP OTP throttle into one global bucket every
# user shares. "native" hands the X-Forwarded-* headers to Tomcat's
# RemoteIpValve, whose default internal-proxies pattern already covers this
# VPC's 10.x subnets - so only the load balancer can set them, not a caller.
server.forward-headers-strategy=native

# RDS (or Aurora) MySQL endpoint
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/job_tracker
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# RDS starts empty (no docker-entrypoint-initdb.d). Apply the idempotent
# schema on every start: CREATE TABLE IF NOT EXISTS only, no drops, no seed
# rows. Kept in sync with infrastructure/config/db-init/02-job-tracker.sql
# by SchemaFilesInSyncTests.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/job-tracker-schema.sql

# SES SMTP for OTP delivery (email-smtp.<region>.amazonaws.com)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.starttls.enable=true
tracker.otp.from=${OTP_FROM_ADDRESS}

# base64 data key from SSM Parameter Store (KMS-encrypted), set by Terraform
tracker.encryption.key=${TRACKER_ENC_KEY}

# the tracker's bare intake address; the dashboard renders each user's
# personal variant as track+<alias>@domain
tracker.intake.address=${INTAKE_ADDRESS}

logging.level.root=info
