#
# qa: runs entirely against AWS. Every ${VAR} below has NO default -
# startup fails fast until the AWS resources exist and are wired in.
# See infrastructure/aws/README.md for provisioning each one.
#
# RDS (or Aurora) MySQL endpoint
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/job_tracker
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# SES SMTP for OTP delivery (email-smtp.<region>.amazonaws.com)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.starttls.enable=true
tracker.otp.from=${OTP_FROM_ADDRESS}

# base64 data key generated by AWS KMS (aws kms generate-data-key)
tracker.encryption.key=${TRACKER_ENC_KEY}

# the tracker's bare intake address; the dashboard renders each user's
# personal variant as track+<alias>@domain
tracker.intake.address=${INTAKE_ADDRESS}

logging.level.root=info
