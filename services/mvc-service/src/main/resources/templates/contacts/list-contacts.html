<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

	<title>Contacts</title>
</head>

<body>

<div class="container">

	<nav class="my-3 d-flex justify-content-between">
		<span>
			<a th:href="@{/applications/list}">Applications</a> |
			<strong>Contacts</strong> |
			<a th:href="@{/dashboard}">My Dashboard</a> |
			<a th:href="@{/profile}">Profile</a>
		</span>
		<a th:href="@{/logout}">Log out</a>
	</nav>

	<h3>Contacts</h3>
	<hr>

	<a th:href="@{/contacts/showFormForAdd}"
		class="btn btn-primary btn-sm mb-3">
		Add Contact
	</a>

	<table class="table table-bordered table-striped">
		<thead class="table-dark">
			<tr>
				<th>First Name</th>
				<th>Last Name</th>
				<th>Email</th>
				<th>Action</th>
			</tr>
		</thead>

		<tbody>
			<tr th:each="tempContact : ${contacts}">

				<td th:text="${tempContact.firstName}" />
				<td th:text="${tempContact.lastName}" />
				<td th:text="${tempContact.email}" />

				<td>
					<a th:href="@{/contacts/showFormForUpdate(contactId=${tempContact.id})}"
					   class="btn btn-info btn-sm">
						Update
					</a>

					<form th:action="@{/contacts/delete}" method="POST" class="d-inline"
						  onsubmit="return confirm('Are you sure you want to delete this contact?')">
						<input type="hidden" name="contactId" th:value="${tempContact.id}" />
						<button type="submit" class="btn btn-danger btn-sm">Delete</button>
					</form>
				</td>

			</tr>
		</tbody>
	</table>

</div>

</body>
</html>
