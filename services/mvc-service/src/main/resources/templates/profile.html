<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

    <title>My Profile</title>
</head>

<body>

<div class="container" style="max-width: 560px;">

    <nav class="my-3 d-flex justify-content-between">
        <span>
            <a th:href="@{/applications/list}">Applications</a> |
            <a th:href="@{/contacts/list}">Contacts</a> |
            <a th:href="@{/dashboard}">My Dashboard</a> |
            <strong>Profile</strong>
        </span>
        <a th:href="@{/logout}">Log out</a>
    </nav>

    <h3>My Profile</h3>
    <p class="text-muted" th:text="${account.email}">you@example.com</p>
    <hr>

    <form action="#" th:action="@{/profile}" method="POST">

        <label class="form-label" for="fullName">Full name</label>
        <input type="text" id="fullName" name="fullName" required
               th:value="${account.fullName}" class="form-control mb-4">

        <label class="form-label" for="phone">Phone (optional, stored encrypted)</label>
        <input type="text" id="phone" name="phone"
               th:value="${account.phone}" class="form-control mb-4" placeholder="+1 555 0100">

        <button type="submit" class="btn btn-primary">Save</button>

    </form>

</div>

</body>
</html>
