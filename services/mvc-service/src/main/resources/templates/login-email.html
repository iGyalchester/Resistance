<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

    <title>Log in</title>
</head>

<body>

    <div class="container" style="max-width: 480px;">

        <h3 class="mt-5">Job Application Tracker</h3>
        <p class="text-muted">No password needed. Enter your email and we'll send you a one-time code.</p>
        <hr>

        <form action="#" th:action="@{/login}" method="POST">

            <input type="email" name="email" required
                   class="form-control mb-4" placeholder="you@example.com">

            <button type="submit" class="btn btn-primary">Send me a code</button>

        </form>

    </div>

</body>

</html>
