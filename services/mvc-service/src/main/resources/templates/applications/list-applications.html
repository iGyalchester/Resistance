<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

	<title>Job Application Tracker</title>
</head>

<body>

<div class="container">

	<nav class="my-3 d-flex justify-content-between">
		<span>
			<strong>Applications</strong> |
			<a th:href="@{/contacts/list}">Contacts</a> |
			<a th:href="@{/dashboard}">My Dashboard</a> |
			<a th:href="@{/profile}">Profile</a>
		</span>
		<a th:href="@{/logout}">Log out</a>
	</nav>

	<h3>Job Application Tracker</h3>
	<hr>

	<!-- Add a button -->
	<a th:href="@{/applications/showFormForAdd}"
		class="btn btn-primary btn-sm mb-3">
		Add Application
	</a>

	<table class="table table-bordered table-striped">
		<thead class="table-dark">
			<tr>
				<th>Company</th>
				<th>Position</th>
				<th>Status</th>
				<th>Contact</th>
				<th>Action</th>
			</tr>
		</thead>

		<tbody>
			<tr th:each="tempApplication : ${applications}">

				<td th:text="${tempApplication.companyName}" />
				<td th:text="${tempApplication.positionTitle}" />
				<td th:text="${tempApplication.status}" />
				<td th:text="${tempApplication.contact != null ? tempApplication.contact.firstName + ' ' + tempApplication.contact.lastName : '-'}" />

				<!-- Add update button/link -->
				<td>
					<a th:href="@{/applications/showFormForUpdate(applicationId=${tempApplication.id})}"
					   class="btn btn-info btn-sm">
						Update
					</a>

					<!-- Delete is a POST so it carries a CSRF token -->
					<form th:action="@{/applications/delete}" method="POST" class="d-inline"
						  onsubmit="return confirm('Are you sure you want to delete this application?')">
						<input type="hidden" name="applicationId" th:value="${tempApplication.id}" />
						<button type="submit" class="btn btn-danger btn-sm">Delete</button>
					</form>
				</td>

			</tr>
		</tbody>
	</table>

</div>

</body>
</html>
