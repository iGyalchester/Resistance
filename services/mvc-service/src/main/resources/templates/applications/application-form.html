<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

    <title>Save Application</title>
</head>

<body>

    <div class="container">

        <h3>Job Application Tracker</h3>
        <hr>

        <p class="h4 mb-4">Save Application</p>

        <form action="#" th:action="@{/applications/save}"
                         th:object="${application}" method="POST">

            <!-- Add hidden form field to handle update -->
            <input type="hidden" th:field="*{id}" />

            <input type="text" th:field="*{companyName}"
                   class="form-control mb-4 w-25" placeholder="Company name">

            <input type="text" th:field="*{positionTitle}"
                   class="form-control mb-4 w-25" placeholder="Position title">

            <select th:field="*{status}" class="form-select mb-4 w-25">
                <option th:each="tempStatus : ${statuses}"
                        th:value="${tempStatus}"
                        th:text="${tempStatus}"></option>
            </select>

            <button type="submit" class="btn btn-info col-2">Save</button>

        </form>

        <hr>
        <a th:href="@{/applications/list}">Back to Applications List</a>

    </div>


</body>

</html>
