spring.application.name=intake-service
server.port=8087

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/job_tracker
spring.datasource.username=springstudent
spring.datasource.password=springstudent

#
# Intake settings
#
# Shared secret for POST /intake/email (X-Intake-Token header).
# Leave empty for local development; ALWAYS set it when exposed publicly.
intake.webhook-token=

# For the AWS SES -> SNS path: only accept notifications from this topic.
# Leave empty for local development.
intake.aws.topic-arn=

# IMAP polling of an ordinary mailbox (e.g. Gmail + app password).
intake.imap.enabled=false
intake.imap.host=imap.gmail.com
intake.imap.username=
intake.imap.password=
intake.imap.poll-ms=60000

spring.main.banner-mode=off
logging.level.root=warn
logging.level.com.resistance=info
