spring.application.name=intake-service
# dev is the default profile (local resources only); run QA with --spring.profiles.active=qa
spring.profiles.default=dev
server.port=8087

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/job_tracker
spring.datasource.username=springstudent
spring.datasource.password=springstudent

#
# Intake settings
#
# Shared secret for POST /intake/email (X-Intake-Token header).
# Leave empty for local development; ALWAYS set it when exposed publicly.
intake.webhook-token=

# For the AWS SES -> SNS path: only accept notifications from this topic.
# Leave empty for local development.
intake.aws.topic-arn=

# Verify SNS message signatures (certificate + RSA check). Secure default;
# the dev profile turns it off so curl smoke tests work.
intake.aws.verify-signature=true

# When true, only mail addressed to a personal alias (track+<alias>@domain)
# is accepted - the bare intake address provisions nothing. On in qa.
intake.require-alias=false

# Claude-backed parsing for emails the heuristics can't handle.
# Enabled automatically when an API key is present (ANTHROPIC_API_KEY
# also works); without one, parsing stays fully offline.
intake.claude.api-key=${ANTHROPIC_API_KEY:}
intake.claude.model=claude-opus-5

# IMAP polling of an ordinary mailbox (e.g. Gmail + app password).
intake.imap.enabled=false
intake.imap.host=imap.gmail.com
intake.imap.username=
intake.imap.password=
intake.imap.poll-ms=60000

spring.main.banner-mode=off
logging.level.root=warn
logging.level.com.resistance=info
