#
# qa: runs entirely against AWS. Every ${VAR} below has NO default -
# startup fails fast until the AWS resources exist and are wired in.
# See infrastructure/aws/README.md for provisioning each one.
#
# Same reason as mvc-service: the ALB terminates TLS, so the forwarded
# headers are the only truthful source for scheme and client address.
# Nothing here reads the client IP today, but the SNS endpoint's absolute
# URLs and anything added later should see what the caller actually used.
server.forward-headers-strategy=native

# RDS (or Aurora) MySQL endpoint
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/job_tracker
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# RDS starts empty (no docker-entrypoint-initdb.d). Apply the idempotent
# schema on every start: CREATE TABLE IF NOT EXISTS only, no drops, no seed
# rows. Kept in sync with infrastructure/config/db-init/02-job-tracker.sql
# by SchemaFilesInSyncTests.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/job-tracker-schema.sql

# shared secret for the plain webhook (from Secrets Manager)
intake.webhook-token=${INTAKE_WEBHOOK_TOKEN}

# SNS topic created by infrastructure/terraform (email-intake module)
intake.aws.topic-arn=${INTAKE_AWS_TOPIC_ARN}
# Set by the Terraform app module from the email-intake module's bucket.
intake.aws.raw-mail-bucket=${INTAKE_RAW_MAIL_BUCKET}

# base64 data key from SSM Parameter Store (KMS-encrypted), set by Terraform
tracker.encryption.key=${TRACKER_ENC_KEY}

# hard security posture: signatures verified, personal aliases required
intake.aws.verify-signature=true
intake.require-alias=true

logging.level.root=info
