name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 6 * * 1'

jobs:
  analyze:
    name: "Analyze Java"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up JDK 26
      uses: actions/setup-java@v6.0.0
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: 'maven'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java-kotlin
        build-mode: manual

    - name: Build
      run: mvn -B clean compile -DskipTests

    - name: Analyze
      uses: github/codeql-action/analyze@v4
