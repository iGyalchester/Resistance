name: Terraform

# Infrastructure for the tracker lives in infrastructure/terraform. This
# workflow only wakes up for changes there.
#
#   pull request -> fmt, validate, tfsec, and a plan for dev and prod
#   push to main -> apply DEV only (develop -> main promotion is the gate)
#   Run workflow  -> apply the chosen environment; the only way prod applies
#
# Auth is GitHub OIDC -> the role bootstrap/ creates: no AWS keys are stored
# in this repository. Until bootstrap has been applied and the AWS_ROLE_ARN
# repository variable set, the plan/apply jobs skip themselves and only the
# offline checks run.
on:
  pull_request:
    paths: ["infrastructure/terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infrastructure/terraform/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        type: choice
        options: [dev, prod]
      rollout_only:
        description: "Only roll the ECS services onto a new image (used by the Deploy workflow). Fails if the plan touches anything else."
        required: false
        default: false
        type: boolean

permissions:
  id-token: write # required to assume the AWS role via OIDC
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.13.5"
  TF_ROOT: infrastructure/terraform
  # Repository variables (Settings > Secrets and variables > Actions > Variables),
  # set once from bootstrap/'s outputs - see infrastructure/terraform/README.md.
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

jobs:
  fmt-and-validate:
    name: fmt & validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [bootstrap, environments/dev, environments/prod]
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive

      - name: terraform init (no backend - syntax/validate only)
        working-directory: ${{ env.TF_ROOT }}/${{ matrix.root }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ env.TF_ROOT }}/${{ matrix.root }}
        run: terraform validate

  security-scan:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/terraform
          soft_fail: true # advisory until its findings have been triaged

  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [fmt-and-validate]
    if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != ''
    strategy:
      matrix:
        environment: [dev, prod]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        # backend.hcl is gitignored (account-specific) - generated here from
        # the TF_STATE_BUCKET repository variable set after bootstrap/.
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
        run: |
          cat > backend.hcl <<EOT
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ matrix.environment }}/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOT

      - name: terraform init
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
        run: terraform init -backend-config=backend.hcl -input=false

      - name: terraform plan
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
        run: terraform plan -var-file=terraform.tfvars -input=false

  apply:
    name: apply (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [fmt-and-validate]
    if: >-
      vars.AWS_ROLE_ARN != '' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    strategy:
      # Push to main auto-applies dev ONLY. prod comes exclusively from the
      # workflow_dispatch input above - GitHub environment protection rules
      # would be the nicer gate, but they need a paid plan on private repos.
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev"]') }}
      max-parallel: 1
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write backend config
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
        run: |
          cat > backend.hcl <<EOT
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ matrix.environment }}/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          EOT

      - name: terraform init
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
        run: terraform init -backend-config=backend.hcl -input=false

      # Plan to a file and apply that exact file, so what is applied is what
      # the guard below inspected - not a second, later plan.
      - name: terraform plan
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
        run: terraform plan -out=tfplan -var-file=terraform.tfvars -input=false

      # A Deploy run must move the image and nothing else. Without this, an
      # unrelated change sitting on main would ride along with the next image
      # deploy - a database replacement, say, that nobody was watching for.
      - name: Refuse anything but a service rollout
        if: inputs.rollout_only
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
        run: |
          set -euo pipefail
          changed=$(terraform show -json tfplan | jq -r '
            (.resource_changes // [])[]
            | select(.change.actions != ["no-op"] and .change.actions != ["read"])
            | .address')

          if [ -z "$changed" ]; then
            echo "Plan is empty - the services already run this image."
            exit 0
          fi

          echo "Planned changes:"
          echo "$changed"

          unexpected=0
          while IFS= read -r address; do
            case "$address" in
              'module.app[0].aws_ecs_task_definition.service['*) ;;
              'module.app[0].aws_ecs_service.service['*) ;;
              *)
                if [ "$unexpected" = 0 ]; then
                  echo "::error::rollout_only was requested, but the plan also changes resources outside the ECS services:"
                fi
                unexpected=1
                echo "  $address"
                ;;
            esac
          done <<PLAN
          $changed
          PLAN

          if [ "$unexpected" = 1 ]; then
            echo "Apply those deliberately with a normal Terraform run first."
            exit 1
          fi

      - name: terraform apply
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
        run: terraform apply -input=false -auto-approve tfplan
