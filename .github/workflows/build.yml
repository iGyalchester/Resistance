name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build and test all modules"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up JDK 26
      uses: actions/setup-java@v5.2.0
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: 'maven'

    # The Spring context tests connect to a real MySQL, initialized with the
    # same schemas/seeds as local dev (infrastructure/config/db-init).
    - name: Start MySQL with tracker schemas
      run: |
        docker run -d --name mysql -p 3306:3306 \
          -e MYSQL_ROOT_PASSWORD=root \
          -v "$PWD/infrastructure/config/db-init:/docker-entrypoint-initdb.d:ro" \
          mysql:9

        echo "Waiting for MySQL and init scripts..."
        for i in $(seq 1 60); do
          if docker exec mysql mysql -h127.0.0.1 -uroot -proot -e "USE job_tracker" 2>/dev/null; then
            echo "MySQL ready"
            exit 0
          fi
          sleep 2
        done
        echo "MySQL did not become ready"
        docker logs mysql
        exit 1

    - name: Build, test, and package all modules
      run: mvn -B clean verify

    - name: Upload boot jars
      uses: actions/upload-artifact@v4
      with:
        name: boot-jars
        path: |
          services/*/target/*.jar
          etl/etl-runner/target/*.jar
          api-gateway/target/*.jar
        if-no-files-found: error
        retention-days: 7

  frontend:
    name: "Build and test frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    # "build" runs tsc --noEmit first, so this is the type check too
    - name: Type-check and build
      working-directory: frontend
      run: npm run build

    - name: Test
      working-directory: frontend
      run: npm test -- --run

    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist
        if-no-files-found: error
        retention-days: 7
